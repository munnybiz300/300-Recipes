name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app tools
        run: |
          npm install
          npm install @capacitor-community/keep-awake || echo "keep-awake skipped (cook mode uses the built-in fallback)"

      - name: Create the Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Use the project's signing key
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 300Recipes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 300Recipes-apk
          path: 300Recipes.apk
          retention-days: 30
